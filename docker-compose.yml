version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soldier_db}
      POSTGRES_USER: ${POSTGRES_USER:-soldier_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soldier_pass_1404}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soldier_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn soldier_management.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-)=c+fdu_r(kb6d9jt+j^_pda)uj!g9a*kvsg4(+zp&n*75u7qg}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - POSTGRES_DB=${POSTGRES_DB:-soldier_db}
      - POSTGRES_USER=${POSTGRES_USER:-soldier_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soldier_pass_1404}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-soldier_user}:${POSTGRES_PASSWORD:-soldier_pass_1404}@db:5432/${POSTGRES_DB:-soldier_db}
    restart: unless-stopped

volumes:
  postgres_data: