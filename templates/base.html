<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سامانه مدیریت سربازان</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.rtl.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/persian-datepicker.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom-dark.css' %}">
    <link href="{% static 'css/all.min.css' %}" rel="stylesheet">
    <style>
        body { font-family: 'IRANSans', Tahoma; background:#121212; color:#eee; }
        .jalali-date { direction: ltr; text-align: center; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/jalali-moment.min.js' %}"></script>
    <script src="{% static 'js/persian-datepicker.min.js' %}"></script>
    <script>
        document.querySelectorAll('.jalali-date').forEach(input => {
            $(input).persianDatePicker({
                format: 'YYYY/MM/DD',
                autoClose: true,
                observer: true,
                calendar: { persian: { locale: 'fa' } }
            });
        });
    </script>
</body>
</html>
