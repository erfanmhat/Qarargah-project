{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    {% include 'admin/soldier_filter.html' %}

    <div class="card bg-dark text-white border-0 shadow">
        <div class="card-header bg-success text-dark fw-bold">
            نتایج جستجو ({{ soldiers|length }} سرباز)
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead class="bg-secondary">
                        <tr>
                            <th>نام و نام خانوادگی</th>
                            <th>کد ملی</th>
                            <th>کد پرونده</th>
                            <th>نوع اعزامی</th>
                            <th>شروع خدمت</th>
                            <th>پایان خدمت</th>
                            <th>وضعیت</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="soldier-results">
                        {% include 'admin/soldier_list.html' %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
function filterSoldiers() {
    const quick = document.getElementById('quick-search').value.toLowerCase();
    const dispatch = document.getElementById('filter-dispatch').value;
    const status = document.getElementById('filter-status').value;
    const location = document.getElementById('filter-location').value;
    const startFrom = document.getElementById('start-from').value;
    const startTo = document.getElementById('start-to').value;
    const expertises = Array.from(document.querySelectorAll('[id^="exp-"]:checked')).map(c => c.value);
    const healthHealthy = document.getElementById('health-healthy').checked;
    const healthExempt = document.getElementById('health-exempt').checked;

    document.querySelectorAll('.soldier-row').forEach(row => {
        const matches = (
            (!quick || row.dataset.name.includes(quick) || row.dataset.national.includes(quick) ||
             row.dataset.dossier.includes(quick) || row.dataset.phone.includes(quick)) &&
            (!dispatch || row.dataset.dispatch === dispatch) &&
            (!status || row.dataset.status === status) &&
            (!location || row.dataset.location === location) &&
            (!startFrom || row.dataset.start >= startFrom.replace(/\//g, '')) &&
            (!startTo || row.dataset.start <= startTo.replace(/\//g, '')) &&
            (expertises.length === 0 || expertises.some(id => row.dataset.expertises.includes(id))) &&
            (!healthHealthy || row.dataset.health === 'healthy') &&
            (!healthExempt || row.dataset.health === 'exempt')
        );
        row.style.display = matches ? '' : 'none';
    });
}

document.querySelectorAll('#quick-search, select, input').forEach(el => {
    el.addEventListener('input', filterSoldiers);
    el.addEventListener('change', filterSoldiers);
});
</script>
{% endblock %}
