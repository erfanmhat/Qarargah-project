{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div class="container-fluid px-4 py-5">
    <div class="text-center mb-5">
        <h1 class="text-success fw-bold display-4">سامانه مدیریت خدمت و مرخصی سربازان</h1>
        <p class="text-white fs-4">پادگان شهید بهشتی</p>
        <hr class="bg-success" style="height: 3px; width: 200px; margin: 20px auto;">
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-lg-3 col-md-6">
            <a href="/admin/soldiers/" class="text-decoration-none">
                <div class="card border-0 shadow-lg text-white h-100" style="background: linear-gradient(135deg, #166534, #22c55e);">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-users fa-4x mb-3"></i>
                        <h3 class="fw-bold">مدیریت سربازان</h3>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-lg-3 col-md-6">
            <a href="/admin/leaves/" class="text-decoration-none">
                <div class="card border-0 shadow-lg text-white h-100" style="background: linear-gradient(135deg, #7c2d12, #ea580c);">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-calendar-check fa-4x mb-3"></i>
                        <h3 class="fw-bold">مدیریت مرخصی‌ها</h3>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-lg-3 col-md-6">
            <a href="/admin/search/" class="text-decoration-none">
                <div class="card border-0 shadow-lg text-white h-100" style="background: linear-gradient(135deg, #1e40af, #3b82f6);">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-search fa-4x mb-3"></i>
                        <h3 class="fw-bold">جستجوی پیشرفته</h3>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-lg-3 col-md-6">
            <a href="/admin/dashboard/" class="text-decoration-none">
                <div class="card border-0 shadow-lg text-white h-100" style="background: linear-gradient(135deg, #581c87, #9333ea);">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-chart-bar fa-4x mb-3"></i>
                        <h3 class="fw-bold">داشبورد آماری</h3>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
