{% load static %}
<div class="card bg-dark text-white border-0 shadow mb-4">
    <div class="card-header bg-success text-dark fw-bold d-flex justify-content-between align-items-center">
        <span>جستجو و فیلتر پیشرفته سربازان</span>
        <button type="button" class="btn btn-sm btn-outline-light" id="clear-filters">
            پاک کردن فیلترها
        </button>
    </div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">جستجوی سریع</label>
                <input type="text" class="form-control" id="quick-search" placeholder="نام، کد ملی، کد پرونده، تلفن...">
            </div>
            <div class="col-md-4">
                <label class="form-label">نوع اعزامی</label>
                <select class="form-select" id="filter-dispatch">
                    <option value="">همه</option>
                    <option value="training">آموزشی</option>
                    <option value="green_card">برگه سبز</option>
                    <option value="ansar_plan">طرح انصار</option>
                    <option value="guard_duty">پاسدار وظیفه</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">وضعیت خدمت</label>
                <select class="form-select" id="filter-status">
                    <option value="">همه</option>
                    {% for status in service_statuses %}
                        <option value="{{ status.id }}">{{ status.title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">محل خدمت</label>
                <select class="form-select" id="filter-location">
                    <option value="">همه</option>
                    {% for loc in locations %}
                        <option value="{{ loc.id }}">{{ loc.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">شروع خدمت (از)</label>
                <input type="text" class="form-control jalali-date" id="start-from" placeholder="1404/01/01">
            </div>
            <div class="col-md-4">
                <label class="form-label">شروع خدمت (تا)</label>
                <input type="text" class="form-control jalali-date" id="start-to" placeholder="1404/12/29">
            </div>
            <div class="col-md-6">
                <label class="form-label">تخصص‌ها</label>
                <div class="row row-cols-3 g-2">
                    {% for exp in expertises %}
                    <div class="col">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="{{ exp.id }}" id="exp-{{ exp.id }}">
                            <label class="form-check-label" for="exp-{{ exp.id }}">{{ exp.title }}</label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label">وضعیت سلامت</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="health-healthy" value="healthy">
                        <label class="form-check-label" for="health-healthy">سالم</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="health-exempt" value="exempt">
                        <label class="form-check-label" for="health-exempt">معاف از رزم</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/persian-datepicker.min.js' %}"></script>
<script>
document.querySelectorAll('.jalali-date').forEach(el => {
    $(el).persianDatePicker({
        format: 'YYYY/MM/DD',
        autoClose: true
    });
});

document.getElementById('clear-filters').addEventListener('click', () => {
    document.querySelectorAll('input, select').forEach(el => {
        if (el.type === 'checkbox') el.checked = false;
        else el.value = '';
    });
    filterSoldiers();
});
</script>
