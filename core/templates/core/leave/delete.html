{% extends “base.html” %}

{% block title %}حذف مرخصی{% endblock %}

{% block content %}

<h2>حذف مرخصی</h2>

<p>

    آیا مطمئن هستید که می‌خواهید مرخصی

    <strong>{{ leave.soldier.full_name }}</strong>

    از

    <strong>{{ leave.start_date }}</strong>

    تا

    <strong>{{ leave.end_date }}</strong>

    را حذف کنید؟

</p>

<form method=“post”>

    {% csrf_token %}

    <button type=“submit” class=“btn btn-danger”>

        بله حذف شود

    </button>

    <a href=“{% url ‘core:leave_list’ %}” class=“btn btn-secondary”>

        انصراف

    </a>

</form>

{% endblock %}
