{% extends "core/base.html" %}

{% block content %}
<div class="container mt-4">

    <h4 class="mb-3">اختصاص دستی سرباز</h4>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">سرباز</label>
            <select name="soldier_id" class="form-control">

                {% for soldier in soldiers %}
                <option value="{{ soldier.id }}">
                    {{ soldier }}
                </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">دلیل تغییر</label>
            <input type="text" name="reason" class="form-control">
        </div>

        <button class="btn btn-primary">
            ثبت
        </button>

    </form>

</div>
{% endblock %}
